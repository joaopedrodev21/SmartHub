{% extends 'base.html' %}

{% block title %}Excluir Cliente - SmartHub CRM{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-header d-flex align-items-center gap-2">
                <i data-lucide="trash-2" class="lucide-card-header"></i>
                <h4 class="mb-0">Excluir Cliente</h4>
            </div>
            <div class="card-body p-4">
                <div class="d-flex align-items-start gap-2 mb-3">
                    <i data-lucide="alert-triangle" class="lucide-warning"></i>
                    <p class="mb-0">Tem certeza que deseja excluir o cliente <strong>{{ object.name }}</strong>?</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex flex-column flex-sm-row gap-2">
                        <a href="{% url 'customers:customer_list' %}" class="btn btn-outline-secondary flex-fill d-inline-flex align-items-center justify-content-center gap-2">
                            <i data-lucide="x" class="lucide-btn-sm"></i>
                            <span>Cancelar</span>
                        </a>
                        <button type="submit" class="btn btn-danger flex-fill d-inline-flex align-items-center justify-content-center gap-2">
                            <i data-lucide="trash-2" class="lucide-btn-sm"></i>
                            <span>Confirmar exclusão</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
