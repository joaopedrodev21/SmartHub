{% extends 'base.html' %}

{% block title %}Excluir cliente{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body text-center">
                <h2 class="fw-bold mb-3">Excluir cliente</h2>
                <p class="text-muted">Tem certeza que deseja excluir o cliente <strong>{{ object.name }}</strong>?</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a href="{% url 'customers:customer_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger">Confirmar exclusão</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
