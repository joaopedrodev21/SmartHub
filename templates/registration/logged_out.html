{% extends 'base.html' %}
{% block title %}Você saiu - SmartHub CRM{% endblock %}
{% block content %}

<div class="row justify-content-center mt-4">
  <div class="col-12 col-sm-10 col-md-6 col-lg-4">
    <div class="card">
      <div class="card-body text-center p-4">
        <div class="d-flex justify-content-center mb-3">
          <i data-lucide="log-out" class="lucide-hero"></i>
        </div>
        <h5 class="card-title">Você saiu</h5>
        <p class="text-muted">Você foi desconectado com sucesso.</p>
        <a href="{% url 'login' %}" class="btn btn-primary w-100 d-inline-flex align-items-center justify-content-center gap-2">
          <i data-lucide="log-in" class="lucide-btn-sm"></i>
          <span>Entrar novamente</span>
        </a>
      </div>
    </div>
  </div>
</div>

{% endblock %}
