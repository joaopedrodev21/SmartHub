{% extends 'base.html' %}

{% block title %}E-mail enviado{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm text-center">
      <div class="card-body">
        <h4 class="mb-2">Verifique seu e-mail</h4>
        <p class="text-muted">Enviamos um link de recuperação para o endereço informado. Caso não apareça, verifique a caixa de spam.</p>
        <a href="{% url 'login' %}" class="btn btn-outline-primary mt-3">Voltar ao login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
