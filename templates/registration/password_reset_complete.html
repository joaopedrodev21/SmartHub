{% extends 'base.html' %}

{% block title %}Senha redefinida{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm text-center">
      <div class="card-body">
        <h4 class="mb-2">Senha redefinida</h4>
        <p class="text-muted">Sua senha foi alterada com sucesso. Você já pode fazer login com a nova senha.</p>
        <a href="{% url 'login' %}" class="btn btn-primary mt-3">Ir para o login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
