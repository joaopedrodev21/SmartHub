<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SmartHub CRM{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">🎮 SmartHub CRM</a>
            <div class="navbar-nav d-flex flex-row gap-3">
                <a class="nav-link" href="{% url 'dashboard' %}">📊 Dashboard</a>
                <a class="nav-link" href="{% url 'products:product_list' %}">📦 Produtos</a>
                <a class="nav-link" href="{% url 'sales:sale_list' %}">💰 Vendas</a>
            </div>
        </div>
        <div class="ms-auto">
            {% if user.is_authenticated %}
                <span class="text-light me-2">{{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Entrar</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
