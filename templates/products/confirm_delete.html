{% extends 'base.html' %}
{% block title %}Excluir Produto{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card">
      <div class="card-header">
        <h4 class="mb-0">Excluir Produto</h4>
      </div>
      <div class="card-body p-4">
        <p>Tem certeza que deseja excluir <strong>{{ object.name }}</strong>?</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger flex-fill">Sim, excluir</button>
            <a href="{% url 'products:product_list' %}" class="btn btn-secondary flex-fill">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
