{% extends 'base.html' %}
{% block title %}Excluir Produto{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card">
      <div class="card-header d-flex align-items-center gap-2">
        <i data-lucide="trash-2" class="lucide-card-header"></i>
        <h4 class="mb-0">Excluir Produto</h4>
      </div>
      <div class="card-body p-4">
        <div class="d-flex align-items-start gap-2 mb-3">
            <i data-lucide="alert-triangle" class="lucide-warning"></i>
            <p class="mb-0">Tem certeza que deseja excluir <strong>{{ object.name }}</strong>?</p>
        </div>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger flex-fill d-flex align-items-center justify-content-center gap-2">
                <i data-lucide="trash-2" class="lucide-btn-sm"></i>
                Sim, excluir
            </button>
            <a href="{% url 'products:product_list' %}" class="btn btn-secondary flex-fill d-flex align-items-center justify-content-center gap-2">
                <i data-lucide="x" class="lucide-btn-sm"></i>
                Cancelar
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
