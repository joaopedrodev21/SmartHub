{% extends 'base.html' %}
{% block title %}{% if form.instance.pk %}Editar{% else %}Novo{% endif %} Produto{% endblock %}
{% block content %}

<h1>{% if form.instance.pk %}Editar{% else %}Novo{% endif %} Produto</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">{% if form.instance.pk %}Atualizar{% else %}Criar{% endif %}</button>
    <a href="{% url 'products:product_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
