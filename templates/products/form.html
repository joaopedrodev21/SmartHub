{% extends 'base.html' %}
{% block title %}{% if form.instance.pk %}Editar{% else %}Novo{% endif %} Produto{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header">
        <h4 class="mb-0">{% if form.instance.pk %}Editar{% else %}Novo{% endif %} Produto</h4>
      </div>
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary flex-fill">{% if form.instance.pk %}Atualizar{% else %}Criar{% endif %}</button>
            <a href="{% url 'products:product_list' %}" class="btn btn-secondary flex-fill">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
